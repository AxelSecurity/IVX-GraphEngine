<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IVX GraphEngine — Dashboard</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="5" cy="6" r="2.4"></circle>
            <circle cx="19" cy="6" r="2.4"></circle>
            <circle cx="12" cy="18" r="2.4"></circle>
            <path d="M6.9 7.4 10.6 16M17.1 7.4 13.4 16M7.4 6h9.2"></path>
          </svg>
        </span>
        <div class="brand-text">
          <div class="brand-title">IVX GraphEngine</div>
          <div class="brand-subtitle">Dashboard sottomissioni</div>
        </div>
      </div>

      <div class="topbar-right">
        <a class="nav-link" id="lists-link" href="#/lists" hidden>Whitelist/Blacklist</a>
        <a class="nav-link" id="users-link" href="#/users" hidden>
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          Utenti
        </a>
        <span class="auth-user" id="auth-user" hidden></span>
        <button class="icon-btn" id="logout-btn" title="Esci" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" x2="9" y1="12" y2="12"></line>
          </svg>
        </button>
        <div class="health-pill" id="health-pill" title="Stato del servizio">
          <span class="dot" id="health-dot"></span>
          <span id="health-text">connessione…</span>
        </div>
        <button class="icon-btn" id="refresh-btn" title="Aggiorna" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"></path>
          </svg>
        </button>
      </div>
    </header>

    <main id="view-root" class="view-root">
      <!-- Renderizzato da app.js -->
    </main>
  </div>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Chiudi">✕</button>
    <img id="lightbox-img" alt="Screenshot a dimensione intera" />
  </div>

  <script src="./app.js"></script>
</body>
</html>
